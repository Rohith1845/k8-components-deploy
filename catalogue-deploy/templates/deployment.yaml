apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalogue.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "catalogue.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "catalogue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalogue.labels" . | nindent 8 }}
      annotations:
        # roll pods automatically when ConfigMap values change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ include "catalogue.name" . }}
          image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion }}"
          imagePullPolicy: {{ .Values.deployment.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "catalogue.name" . }}
          ports:
            - name: http
              containerPort: {{ .Values.deployment.containerPort }}
              protocol: TCP
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
