apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalogue.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "catalogue.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "catalogue.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.servicePort }}
      targetPort: http
