apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cart.name" . }}
  # namespace: roboshop
  # these are replica set labels
  labels:
    {{- include "cart.labels" . | nindent 4 }}
    # project: roboshop
    # component: cart
    # tier: backend
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    # these labels are used to select pods
    matchLabels:
      {{- include "cart.labels" . | nindent 6 }}
      # project: roboshop
      # component: cart
      # tier: backend
  # pod definition
  template:
    metadata:
      labels:
        {{- include "cart.labels" . | nindent 8 }}
        # project: roboshop
        # component: cart
        # tier: backend
    spec:
      containers:
      - name: {{ include "cart.name" . }}
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion}}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        envFrom:
        - configMapRef:
            name: {{ include "cart.name" . }}
        ports:
        - name: liveness-port
          containerPort: 8080
        resources:
          requests:
            cpu: {{ .Values.deployment.resources.requests.cpu }}
            memory: {{ .Values.deployment.resources.requests.memory }}
          limits:
            cpu: {{ .Values.deployment.resources.limits.cpu }}
            memory: {{ .Values.deployment.resources.limits.memory }}
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
