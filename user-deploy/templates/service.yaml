apiVersion: v1
kind: Service
metadata:
  name: {{ include "user.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "user.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.servicePort }}
      targetPort: http
