configMap:
  MONGO: "true"
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"

deployment:
  replicas: 1
  imageRepo: 153402910823.dkr.ecr.us-east-1.amazonaws.com/roboshop/user
  imageVersion: IMAGE_VERSION
  imagePullPolicy: Always
  containerPort: 8080
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    failureThreshold: 3

service:
  servicePort: 8080
