apiVersion: v1
kind: Service
metadata:
  name: {{ include "shipping.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shipping.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "shipping.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.servicePort }}
      targetPort: http
