apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payment.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment.labels" . | nindent 4 }}
type: Opaque
stringData:
  AMQP_PASS: {{ required "secret.AMQP_PASS is required (pass with --set)" .Values.secret.AMQP_PASS | quote }}
