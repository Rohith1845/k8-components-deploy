apiVersion: v1
kind: Service
metadata:
  name: {{ include "payment.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "payment.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.servicePort }}
      targetPort: http
